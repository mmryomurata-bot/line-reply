<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LINE返信">
<meta name="theme-color" content="#ffffff">
<title>LINE返信</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .msg { font: 15px -apple-system, "Hiragino Sans", sans-serif; color: #555; padding: 40px 20px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
<script>
  // 合言葉はURLの # 以降で受け取る（ページ本体には書かない）。例: #k=合言葉&u=ユーザーID
  var BASE = 'https://script.google.com/macros/s/AKfycbx_XYcMu-bVYr0m_EMUK7hRYI7pmIhqvnsqWokKAOHgWCg-knkKedJbjbmihQIDVMpp/exec';
  var h = new URLSearchParams(location.hash.slice(1));
  var k = h.get('k');
  try { if (k) localStorage.setItem('ibx_k', k); else k = localStorage.getItem('ibx_k'); } catch (e) {}
  if (!k) {
    document.body.innerHTML = '<div class="msg">このページを開くには、通知にあるリンクから開いてください。</div>';
  } else {
    var src = BASE + '?page=inbox&k=' + encodeURIComponent(k) + (h.get('u') ? '&u=' + encodeURIComponent(h.get('u')) : '');
    var f = document.createElement('iframe');
    f.src = src;
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
    if (h.get('u')) history.replaceState(null, '', location.pathname); // 通知から開いたあとは、URLから人の指定を消す
  }
</script>
</body>
</html>
