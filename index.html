<html>
<head>

<style>
  :root { --bg:#f6f3ee; --card:#fffdf8; --line:#e8e1d6; --ink:#2b2622; --sub:#8a8178; --red:#c0392b; --gold:#d4a73a;
          --pink:#f9e3ea; --pinkink:#b0365d; --blue:#e3eefb; --blueink:#2d5f9a; --purple:#ece6fb; --purpleink:#5b3fb0;
          --gray:#efece7; --grayink:#6d655d; --me:#cfe0f5; --draft:#b3262e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:16px; }
  header { position:sticky; top:0; z-index:5; background:#fff; padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:22px; font-weight:800; }
  .quota { float:right; font-size:12px; color:var(--sub); margin-top:6px; }
  .search { margin-top:10px; width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:#fafafa; }
  .tabs { display:flex; gap:6px; margin-top:10px; }
  .tabs button { flex:1; padding:9px 0; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:14px; font-weight:700; color:var(--sub); }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .tabs button .n { font-weight:800; margin-left:3px; }
  .summary { margin:8px 10px; padding:9px 13px; background:#fff3f0; border:1px solid #f0c9c0; border-radius:14px; color:#8a2c1f; font-size:14px; line-height:1.6; }
  .summary b { font-size:16px; }
  .sec { display:flex; justify-content:space-between; padding:16px 18px 6px; font-size:13px; font-weight:800; color:var(--sub); letter-spacing:.05em; }
  .sec span { font-weight:700; }
  .row { display:flex; gap:12px; padding:13px 14px; margin:8px 10px; border-radius:14px; background:#fff; cursor:pointer; position:relative; border:1px solid var(--line); }
  .row:active { background:#f4f1ec; }
  .row.need { border:2px solid #e2b53e; background:#fffbef; box-shadow:0 2px 6px rgba(160,120,20,.12); }
  .av { width:50px; height:50px; border-radius:50%; background:#c9b9a6 center/cover; flex:none; display:flex; align-items:center; justify-content:center; font-size:21px; color:#fff; font-weight:700; }
  .mid { flex:1; min-width:0; }
  .top { display:flex; align-items:center; gap:8px; }
  .nm { font-weight:800; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .row:not(.need) .nm { font-weight:700; color:#4a433d; }
  .ln { font-size:12px; color:var(--sub); }
  .tm { font-size:13px; color:var(--sub); flex:none; }
  .wt { flex:none; font-size:12.5px; font-weight:800; color:#8a5a00; background:#fbe7b0; border-radius:20px; padding:2px 9px; }
  .wt.late { background:var(--red); color:#fff; }
  .pv { font-size:15px; line-height:1.45; margin:4px 0 7px; color:#2b2622; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; }
  .row:not(.need) .pv { color:var(--sub); font-size:14px; -webkit-line-clamp:1; }
  .who { font-weight:700; color:var(--sub); margin-right:5px; font-size:12.5px; }
  .tags { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .tag { font-size:12px; padding:2px 9px; border-radius:20px; border:1px solid transparent; font-weight:600; }
  .st { font-size:12.5px; font-weight:800; padding:3px 10px; border-radius:8px; }
  .st-ok { background:#6a4bc4; color:#fff; } .st-low { background:#efece7; color:#6d655d; }
  .t-red { background:var(--pink); color:var(--pinkink); } .t-blue { background:var(--blue); color:var(--blueink); }
  .t-purple { background:var(--purple); color:var(--purpleink); } .t-gray { background:var(--gray); color:var(--grayink); }
  .t-draft { background:#6a4bc4; color:#fff; } .t-today { background:#1f9d55; color:#fff; } .t-dates { background:#fff; color:#2f7a3b; border-color:#bfe3c8; } .t-ai { background:#fff; color:var(--sub); border-color:var(--line); }
  .empty { text-align:center; color:var(--sub); padding:40px 16px; }

  /* やりとり */
  #thread { display:none; flex-direction:column; height:100vh; height:100dvh; background:#fff; }
  .th-head { background:#fff; padding:10px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .back { font-size:30px; line-height:1; padding:0 6px; cursor:pointer; color:var(--ink); background:none; border:0; }
  .th-head .av { width:40px; height:40px; font-size:17px; }
  .th-head .nm { font-size:18px; }
  .chips { padding:6px 12px; background:#fff; border-bottom:1px solid var(--line); display:flex; gap:5px; overflow-x:auto; white-space:nowrap; }
  .msgs { flex:1; overflow-y:auto; padding:12px 12px 20px; background:#fff; }
  .day { text-align:center; font-size:12px; color:var(--sub); margin:14px 0 6px; }
  .bl { display:flex; align-items:flex-end; gap:6px; margin:8px 0; }
  .bl.r { flex-direction:row-reverse; }
  .b { max-width:78%; padding:10px 13px; border-radius:18px; white-space:pre-wrap; word-break:break-word; line-height:1.55; font-size:15.5px; }
  .bl.l .b { background:#eeeeee; border-top-left-radius:6px; }
  .bl.r .b { background:var(--me); border-top-right-radius:6px; }
  .bl.r.bot .b { background:#e6eef8; }
  .bt { font-size:11px; color:var(--sub); flex:none; text-align:right; line-height:1.3; }
  .card { border:2px solid var(--draft); border-radius:16px; padding:12px 14px; margin:16px 0 6px; background:#fbfbfb; }
  .card-h { font-weight:800; font-size:15px; color:#444; }
  .card-q { font-size:13px; color:var(--sub); margin-top:6px; line-height:1.5; }
  .purpose { background:#e9f6ea; color:#2f7a3b; font-weight:800; border-radius:10px; padding:7px 11px; margin-top:8px; font-size:13.5px; line-height:1.5; }
  .card-in { background:#f1f1f1; border-radius:12px; padding:8px 11px; margin-top:8px; }
  .ci { font-size:15px; line-height:1.5; color:#222; white-space:pre-wrap; padding:2px 0; }
  .cit { font-size:11px; color:var(--sub); margin-right:6px; }
  .note.shut { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .more { font-size:12.5px; color:#7a5200; margin-top:3px; text-align:right; }
  .note { background:#fff6dd; color:#7a5200; border-radius:10px; padding:8px 11px; margin-top:8px; font-size:13.5px; line-height:1.5; }
  .nth { font-size:12px; color:var(--sub); margin-top:12px; }
  .mtext { white-space:pre-wrap; line-height:1.6; font-size:15.5px; margin-top:3px; }
  .card textarea { width:100%; font-size:16px; padding:8px; border:1px solid var(--line); border-radius:8px; font-family:inherit; margin-top:3px; }
  .resume { display:flex; gap:8px; align-items:flex-start; font-size:13.5px; margin-top:12px; color:#444; line-height:1.5; }
  .resume input { width:20px; height:20px; flex:none; margin-top:1px; }
  .cbtns { display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  .cb { padding:10px 18px; border-radius:12px; border:1px solid #ddd; background:#fff; font-size:16px; font-weight:800; color:var(--ink); }
  .cb.send { background:var(--draft); border-color:var(--draft); color:#fff; }
  .cb:disabled { opacity:.5; }
  .qinfo { font-size:12px; color:var(--sub); margin-left:auto; }
  .sub-btns { display:flex; gap:14px; margin-top:10px; font-size:13px; }
  .sub-btns a { color:var(--sub); text-decoration:underline; cursor:pointer; }
  .composer { background:#fff; border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:flex-end; }
  .composer textarea { flex:1; min-height:42px; max-height:30vh; font-size:16px; padding:9px 12px; border:1px solid #ccc; border-radius:12px; font-family:inherit; resize:none; }
  .icon { font-size:26px; background:none; border:0; padding:4px; line-height:1; }
  .sendb { font-size:24px; color:#7a8aa8; background:none; border:0; padding:6px; }
  .rgbar { margin:10px 10px 0; padding:10px 13px; background:#eef4ff; border:1px solid #c9d8f3; border-radius:14px; color:#24477a; font-size:15px; font-weight:700; cursor:pointer; }
  #guide { display:none; min-height:100vh; background:var(--bg); }
  .gi { background:#fff; margin:12px; border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .gi .nm { font-size:17px; }
  .gi .st { font-size:13px; color:var(--sub); margin-top:4px; }
  .gprev { white-space:pre-wrap; font-size:13.5px; line-height:1.55; color:#444; background:#fafafa; border-radius:10px; padding:10px; margin:10px 12px; border:1px solid var(--line); }
  .gimgs { display:flex; gap:6px; margin:0 12px 12px; } .gimgs img { width:31%; border-radius:8px; }
  .toast { position:fixed; left:50%; bottom:30%; transform:translateX(-50%); background:rgba(30,30,30,.92); color:#fff; padding:12px 18px; border-radius:12px; font-size:15px; display:none; z-index:20; max-width:85%; text-align:center; }

  /* ---- LINE風の色(2026-11-10 オーナー指示) ---- */
  :root { --lg:#06c755; --lgd:#05b34c; --ink:#111; --sub:#8c8c8c; --line:#ececec; --bg:#fff; --draft:#06c755; --me:#8de055; }
  html, body { background:#fff; color:#111; }
  header { border-bottom:0; padding-bottom:0; }
  h1 { font-size:20px; }
  .search { background:#f2f3f5; border:0; border-radius:8px; }
  .tabs { gap:0; margin-top:8px; border-bottom:1px solid var(--line); }
  .tabs button { border:0; border-radius:0; background:none; color:#8c8c8c; padding:10px 0 9px; border-bottom:2px solid transparent; }
  .tabs button.on { background:none; color:#111; border-bottom-color:#111; }
  .rgbar { background:#f7f8fa; border:0; border-radius:10px; color:#111; font-weight:600; font-size:14px; }
  .summary { background:#f7f8fa !important; border:0 !important; color:#111 !important; border-radius:10px; }
  .sec { color:#8c8c8c; font-weight:600; padding:14px 16px 4px; }

  .row:active { background:#f5f5f5; }
  .av { width:52px; height:52px; background-color:#d9dde3; }
  .nm { color:#111; }
  .row:not(.need) .nm { color:#111; font-weight:600; }
  .pv { color:#555; font-size:14px; margin:3px 0 6px; }
  .row:not(.need) .pv { color:#8c8c8c; }
  .wt { background:var(--lg); color:#fff; font-weight:700; border-radius:20px; }
  .wt.late { background:#ff4b3a; }
  .tm { font-size:12px; color:#9a9a9a; }
  .who { color:#9a9a9a; font-weight:600; }
  .tag { font-weight:500; }
  .t-gray, .t-purple, .t-red, .t-blue { background:#f2f3f5; color:#666; }
  .t-dates { background:#fff; color:var(--lgd); border-color:#bfe9cf; }
  .t-today { background:var(--lg); }
  .st-ok, .t-draft { background:#e7f8ee; color:var(--lgd); }
  .st-low { background:#f2f3f5; color:#8c8c8c; font-weight:600; }
  /* やりとり */
  #thread { background:#8cabd8; }
  .th-head { background:#fff; border-bottom:0; }
  .chips { background:#fff; border-bottom:1px solid #e3e3e3; }
  .msgs { background:#8cabd8; }
  .day { color:#fff; }
  .day { display:table; margin:14px auto 8px; background:rgba(0,0,0,.18); padding:2px 10px; border-radius:12px; font-size:11.5px; }
  .bt { color:rgba(255,255,255,.95); }
  .bl.l .b { background:#fff; border-radius:18px; border-top-left-radius:4px; }
  .bl.r .b { background:var(--me); border-radius:18px; border-top-right-radius:4px; }
  .bl.r.bot .b { background:#dff5c9; }
  .card { background:#fff; border:0; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .card-h { color:#111; }
  .nth { color:#9a9a9a; }
  .mtext { background:#f2f3f5; border-radius:12px; padding:9px 12px; margin-top:4px; }
  .cb { border-radius:22px; border:1px solid #ddd; font-weight:700; padding:9px 20px; }
  .cb.send { background:var(--lg); border-color:var(--lg); }
  .composer { border-top:1px solid #e3e3e3; }
  .composer textarea { background:#f2f3f5; border:0; border-radius:20px; }
  .sendb { color:var(--lg); }

  /* 女の子の情報・判定 */
  .tabs button { font-size:13px; }
  /* タブの件数は色つきの丸。0件のタブは薄くする(2026-11-11 オーナー了承) */
  /* 件数はタブ名の真上に乗せる(左右どちらの数か迷わないように。2026-11-11 オーナー指示) */
  .tabs button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; white-space:nowrap; padding:7px 0 7px; }
  .tabs button .n { display:inline-block; min-width:19px; height:19px; line-height:19px; padding:0 5px; border-radius:10px; font-size:11.5px; font-weight:800; color:#fff; margin-left:0; box-sizing:border-box; }
  .tabs .c-red .n { background:#ff3b30; } .tabs .c-org .n { background:#ff9500; } .tabs .c-yel .n { background:#f5b800; }
  .tabs .c-grn .n { background:#06c755; } .tabs .c-gry .n { background:#b8b8b8; }
  .tabs button.zero { opacity:.4; } .tabs button.zero .n { background:#c8c8c8; }
  .tabs button.on { opacity:1; }
  .ptodo { margin-top:5px; font-size:13px; font-weight:700; color:#c26a00; background:#fff6e8; border-radius:8px; padding:5px 9px; line-height:1.4; }
  .ptodo.soon { color:#fff; background:#ff3b30; }
  .meta { margin-top:4px; font-size:12.5px; color:#8c8c8c; line-height:1.45; }
  .meta .dot { color:#d0d0d0; margin:0 4px; }
  .row .tags { margin-top:5px; } .row .tags:empty { display:none; }
  .plbl { font-size:11.5px; color:#b35c00; font-weight:700; }
  .pchip { display:inline-block; background:#fff; color:#b35c00; border:1px solid #ffc978; border-radius:10px; padding:1px 7px; font-size:11.5px; font-weight:700; margin-right:3px; }
  .t-info { background:#fff; color:#555; border-color:#e2e2e2; }
  .st-judge { background:#fff4d6; color:#9a6a00; }
  .jt { font-weight:700; } .j-big { background:#1b73e8 !important; color:#fff !important; } .j-yes { background:var(--lg) !important; color:#fff !important; }
  .j-no { background:#9a9a9a !important; color:#fff !important; } .j-ban { background:#e53935 !important; color:#fff !important; }
  .b.media { background:transparent !important; padding:0 !important; box-shadow:none !important; }
  .b.media .stk { width:120px; height:auto; display:block; }
  .b.media .pic { max-width:200px; max-height:260px; border-radius:14px; display:block; background:#ddd; min-width:80px; min-height:80px; object-fit:cover; }
  .bigimg { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:99; display:flex; align-items:center; justify-content:center; }
  .bigimg img { max-width:100%; max-height:100%; }
  .ub { flex:none; margin-left:6px; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:#06c755; color:#fff; font-size:12px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
  .row.unread .nm { font-weight:900 !important; color:#000 !important; }
  .row.unread .pv { color:#111 !important; font-weight:600; }
  .bellb { font-size:12px; border:1px solid #ddd; background:#fff; border-radius:14px; padding:3px 10px; margin-left:6px; vertical-align:middle; }
  .pend { display:inline-block; background:#fff1dc; color:#b35c00; border:1px solid #ffc978; font-weight:800; border-radius:12px; padding:2px 9px; font-size:12px; }
  .pend.soon { background:#ff3b30; color:#fff; border-color:#ff3b30; }
  .quick { display:flex; gap:8px; padding:6px 10px; background:#fff; border-top:1px solid #eee; overflow-x:auto; }
  .quick button { flex:none; border:1px solid #d6d6d6; background:#fff; border-radius:18px; padding:6px 14px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:4px; }
  .quick button img { width:26px; height:26px; }
  .quick .qres { background:#fff6e8; border-color:#ffc978; color:#b35c00; }
  .st-hold { background:#ffe5e3; color:#d0302a; }
  .freeb { display:inline-block; background:#06c755; color:#fff; font-weight:800; border-radius:12px; padding:2px 9px; font-size:12px; }
  .freeb.low { background:#ff3b30; }
  .modeb { flex:none; border:none; border-radius:16px; padding:6px 12px; font-size:13px; font-weight:800; margin-right:6px; }
  .modeb.auto { background:#06c755; color:#fff; } .modeb.manual { background:#ff9f0a; color:#fff; }
  .t-manual { background:#fff1dc; color:#b86a00; }
  .infob { flex:none; border:1px solid #ddd; background:#fff; border-radius:16px; padding:5px 12px; font-size:13px; font-weight:700; color:#333; }
  .jbar { display:none; background:#fffbe8; border-bottom:1px solid #f0e2b0; padding:10px 12px; }
  .jq { font-size:13.5px; font-weight:700; margin-bottom:8px; color:#6b5200; }
  .jbs { display:flex; gap:6px; flex-wrap:wrap; }
  .jb { flex:1; min-width:70px; padding:10px 4px; border-radius:12px; border:0; font-size:14px; font-weight:800; opacity:.9; }
  .jbs .jb:not(.on) { filter:saturate(.85); }
  .psheet .jb:not(.on) { background:#f2f3f5 !important; color:#555 !important; }
  .jb.on { box-shadow:0 0 0 3px rgba(0,0,0,.18) inset; opacity:1; }
  .prof { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; align-items:flex-end; justify-content:center; }
  .psheet { background:#fff; width:100%; max-width:640px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:14px 16px calc(20px + env(safe-area-inset-bottom)); }
  .ph { display:flex; align-items:center; justify-content:space-between; font-size:17px; margin-bottom:10px; }
  .pclose { border:0; background:#f2f3f5; width:34px; height:34px; border-radius:50%; font-size:20px; }

  /* LINEと同じ薄い見出し(2026-11-11) */

  .qfree:empty { display:none; } .qfree { display:flex; align-items:center; flex:none; }
  /* 情報ページ: 全画面で切りかえ */
  .prof { background:#fff; flex-direction:column; align-items:stretch; justify-content:flex-start; }
  .prof .psheet { max-width:none; max-height:none; flex:1; border-radius:0; padding:0 18px calc(28px + env(safe-area-inset-bottom)); }
  .phero { text-align:center; padding:22px 0 14px; }
  .phero .av { width:76px; height:76px; font-size:30px; margin:0 auto 10px; }
  .pnm { font-size:19px; font-weight:800; }
  .psub { font-size:12.5px; color:#9a9a9a; margin-top:4px; }
  .prof .ptodo { margin:0 0 14px; text-align:center; }
  .prof .pph { margin-bottom:4px; } .prof .pph img { height:150px; border-radius:12px; }
  .prof .psec { font-size:11.5px; letter-spacing:.6px; color:#a8a8a8; font-weight:700; margin:22px 0 2px; }
  .prof .pr { border-bottom:1px solid #f4f4f4; padding:10px 0; font-size:14.5px; }
  .prof .pk { width:88px; color:#a0a0a0; font-size:13px; }
</style>
</head>
<body>
<div id="list">
  <header>
    <span class="quota" id="quota" style="display:none"></span>
    <h1 onclick="askBadge()">トーク <button class="bellb" id="bell" style="display:none"></button><span id="cnt" style="display:none">…</span></h1>
    <input class="search" id="q" placeholder="検索（名前・源氏名・本文）" oninput="renderList()">
    <div class="tabs" id="tabs">
      <button data-f="need" data-l="返事待ち" class="c-red" onclick="setFilter('need')">返事待ち</button>
      <button data-f="pend" data-l="受入れ未" class="c-org" onclick="setFilter('pend')">準備まだ</button>
      <button data-f="judge" data-l="判定待ち" class="c-yel" onclick="setFilter('judge')">判定待ち</button>
      <button data-f="today" data-l="出勤中" class="c-grn" onclick="setFilter('today')">出勤中</button>
      <button data-f="all" data-l="すべて" class="c-gry" onclick="setFilter('all')">すべて</button>
    </div>
  </header>
  <div id="summary"></div>
  <div id="rows"><div class="empty">読み込み中…</div></div>
</div>

<div id="guide">
  <div class="th-head"><button class="back" onclick="closeGuide()">‹</button><div class="nm">🏠 出勤前日のルーム案内</div></div>
  <div id="gBody"><div class="empty">読み込み中…</div></div>
</div>
<div id="thread">
  <div class="th-head lh">
    <button class="back" onclick="closeThread()">‹</button>
    <div class="ttl" onclick="openProf()"><span class="nm" id="tName"></span><span class="nd" id="tNext"></span></div>
    <button class="modeb" id="tMode" onclick="toggleMode()"></button>
    <button class="infob ib" onclick="openProf()" aria-label="情報"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor"/><rect x="11.1" y="10.4" width="1.8" height="7" rx=".9" fill="currentColor"/></svg></button>
  </div>
  <div class="jbar" id="tJudge"></div>
  <div class="msgs" id="tMsgs"></div>
  <div class="quick">
    <span id="tFree" class="qfree"></span>
    <button id="qResume" class="qres" onclick="resumeAsk()" style="display:none"></button>
    <button onclick="quickSend('お願いします！')">お願いします！</button>
    <button onclick="quickSend(BOW)"><img src="https://stickershop.line-scdn.net/stickershop/v1/sticker/52002739/android/sticker.png" alt="">ペコリ</button>
  </div>
  <div class="composer">
    <button class="icon" title="案を作り直す" onclick="redraft()">🤖</button>
    <textarea id="tText" rows="1" placeholder="メッセージを入力"></textarea>
    <button class="sendb" onclick="sendFree()">➤</button>
  </div>
</div>
<div class="prof" id="prof"><div class="th-head lh"><button class="back" onclick="closeProf()">‹</button><div class="ttl"><span class="nm">情報</span></div></div><div class="psheet" id="pBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx_XYcMu-bVYr0m_EMUK7hRYI7pmIhqvnsqWokKAOHgWCg-knkKedJbjbmihQIDVMpp/exec';
const HP = new URLSearchParams(location.hash.slice(1));
let K = HP.get('k') || new URLSearchParams(location.search).get('k');
try { if (K) localStorage.setItem('ibx_k', K); else K = localStorage.getItem('ibx_k'); } catch (e) {}
// 合言葉はURLの ?k= に残す(ホーム画面のアイコンは別の保存場所になるため)。#以降は開く人だけ
if (K && HP.get('k')) history.replaceState(null, '', location.pathname + '?k=' + encodeURIComponent(K) + (HP.get('u') ? '#' + HP.get('u') : ''));
window.onerror = (m, src, line) => { toast('エラー: ' + m + ' (' + line + ')', 6000); };
let DATA = null, CUR = null, T = null, timer = null, editing = false, busy = false;
const OPEN_USER = '';
let FILTER = 'need';
try { FILTER = localStorage.getItem('ibxFilter2') || 'need'; } catch (e) {}
function setFilter(f) { FILTER = f; try { localStorage.setItem('ibxFilter2', f); } catch (e) {} renderList(); }

function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m, ms) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms || 2400); }
const p2 = x => String(x).padStart(2, '0');
function hm(ts) { const d = new Date(ts); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function fmt(ts) { if (!ts) return ''; const d = new Date(ts); return d.toDateString() === new Date().toDateString() ? hm(ts) : (d.getMonth() + 1) + '/' + d.getDate(); }
function dayLabel(ts) { const d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'[d.getDay()] + '）'; }
function avatar(el, pic, name) { el.style.backgroundImage = pic ? 'url(' + pic + ')' : ''; el.textContent = pic ? '' : (name || '?').slice(0, 1); }
async function call(fn, ...args) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ rpc: fn, k: K, args: args }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'エラー');
  return j.r;
}
function quotaText(q) { return q && q.used != null ? (q.limit ? '今月のプッシュ 残り' + (q.limit - q.used) + '通' : '今月のプッシュ ' + q.used + '通') : ''; }

// ---------- 一覧 ----------
// 前回の中身を端末に覚えておき、開いた瞬間はそれを出す(裏で最新に入れかえる)
function cacheGet(k) { try { return JSON.parse(localStorage.getItem('ibxc_' + k) || 'null'); } catch (e) { return null; } }
function cachePut(k, v) { try { localStorage.setItem('ibxc_' + k, JSON.stringify(v)); } catch (e) {} }
// 一覧と全員のやりとりを1回でまとめて読む(変わった人の分だけ届く)。開いた瞬間は端末に覚えた前回分を出す
let TH = cacheGet('th') || {}, loading = null;
function loadList() { return loadAll(); }
async function loadAll() {
  if (!DATA) { const c = cacheGet('list'); if (c) { DATA = c; renderList(); } }
  if (loading) return loading;
  loading = (async () => {
    try {
      const have = {}; Object.keys(TH).forEach(u => have[u] = TH[u].sig);
      const r = await call('ibxAll', have);
      applyAll(r);
    } catch (e) { if (!DATA) document.getElementById('rows').innerHTML = '<div class="empty">読み込めませんでした: ' + esc(e.message) + '</div>'; }
    finally { loading = null; }
  })();
  return loading;
}
function applyAll(r) {
      const keep = {}; r.rows.forEach(x => keep[x.user] = 1);
      Object.keys(TH).forEach(u => { if (!keep[u]) delete TH[u]; });
      Object.assign(TH, r.threads);
      delete r.threads;
      DATA = r; cachePut('list', DATA); cachePut('th', TH);
      if (CUR && TH[CUR] && !editing && !busy) { T = Object.assign({}, TH[CUR], { quota: DATA.quota }); render(); }
      if (CUR && document.getElementById('thread').style.display !== 'none') markRead(CUR);
      updateBadge();
      if (!CUR || document.getElementById('list').style.display !== 'none') renderList();
}
function renderList() {
  if (!DATA) return;
  const q = document.getElementById('q').value.trim();
  const rows = DATA.rows.filter(r => (!q || (r.name + r.ln + r.last).indexOf(q) !== -1)
    && (FILTER === 'all' || (FILTER === 'need' && r.need) || (FILTER === 'today' && r.today) || (FILTER === 'judge' && r.needJudge) || (FILTER === 'pend' && r.pend)));
  const cnt = { pend: DATA.rows.filter(r => r.pend).length, judge: DATA.rows.filter(r => r.needJudge).length, need: DATA.rows.filter(r => r.need).length, today: DATA.rows.filter(r => r.today).length, all: DATA.rows.length };
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.f === FILTER);
    const n = cnt[b.dataset.f];
    b.classList.toggle('zero', !n);
    b.innerHTML = '<span class="n">' + (n > 99 ? '99+' : n) + '</span>' + b.dataset.l;
  });
  document.getElementById('cnt').textContent = DATA.rows.length;
  const need = DATA.rows.filter(r => r.need);
  document.getElementById('quota').textContent = quotaText(DATA.quota);
  const working = DATA.rows.filter(r => r.today);
  const todayHtml = working.length ? '<div class="summary" style="background:#eaf7ee;border-color:#bfe3c8;color:#1f6b3a"><b>🟢 本日出勤 ' + working.length + '人</b><br>' + working.map(r => esc(r.name)).join('、') + '</div>' : '';
  const rgHtml = '<div class="rgbar" onclick="openGuide()">🏠 ルーム案内' + (DATA.rgWait ? '　<span style="color:#c0392b">確認待ち ' + DATA.rgWait + '人</span>' : '') + '　›</div>';
  document.getElementById('summary').innerHTML = ''; // 一覧はLINEと同じく名前・本文・時間だけ(2026-11-11 オーナー指示) // ルーム案内は自動で送るので入口は出さない(2026-11-11 オーナー指示) // 要返信の赤い枠は出さない(2026-11-09 オーナー指示)。人数はタブに出る
  // 返事待ち → 本日出勤 → その他 の順に区切って出す。返事待ちは待っている時間の長い順
  const wait = rows.filter(r => r.need).sort((x, y) => x.ts - y.ts);
  const rest = rows.filter(r => !r.need);
  const sec = (title, list) => list.length ? '<div class="sec">' + title + '<span>' + list.length + '</span></div>' + list.map(rowHtml).join('') : '';
  document.getElementById('rows').innerHTML = rows.length
    ? (FILTER === 'pend' ? rows.slice().sort((x, y) => (x.pend.start || '9999') < (y.pend.start || '9999') ? -1 : 1).map(rowHtml).join('')
      : FILTER === 'need' || FILTER === 'judge' ? (FILTER === 'judge' ? rows : wait).map(rowHtml).join('') : sec('返事待ち', wait) + sec(FILTER === 'today' ? '本日出勤' : 'その他', rest))
    : '<div class="empty">' + (FILTER === 'need' ? '返事待ちの人はいません 🎉' : FILTER === 'pend' ? '受け入れ体制が⭕️になっていない人はいません 🎉' : FILTER === 'judge' ? '判定待ちの人はいません' : FILTER === 'today' ? '出勤中の人はいません' : 'まだやりとりがありません') + '</div>';
  document.querySelectorAll('#rows .av').forEach(el => avatar(el, el.dataset.pic, el.dataset.nm));
}


function ago(ts) {
  const m = Math.max(0, Math.floor((Date.now() - ts) / 60000));
  return m < 1 ? 'たった今' : m < 60 ? m + '分' : m < 1440 ? Math.floor(m / 60) + '時間' : Math.floor(m / 1440) + '日';
}
function rowHtml(r) {
  const who = r.dir === 'in' ? '' : r.dir === 'me' ? '<b class="who">あなた</b>' : '<b class="who">ボット</b>';
  const st = !r.need ? '' : r.held && !r.draft && !r.aiWait ? '<span class="st st-hold">🙋 あなたの判断待ち</span>' : r.draft ? '<span class="st st-ok">📝 案あり・送るだけ</span>' : r.noReply ? '<span class="st st-low">返事いらなそう</span>'
    : r.aiWait ? '<span class="st st-low">AIが返事中</span>' : '<span class="st st-low">案を作成中…</span>';
  const late = r.need && Date.now() - r.ts > 3 * 3600000;
  return `<div class="row ${r.need ? 'need' : ''}${r.unread ? ' unread' : ''}" onclick="openThread('${r.user}')">
      <div class="av" data-pic="${esc(r.pic)}" data-nm="${esc(r.name)}"></div>
      <div class="mid">
        <div class="top"><span class="nm">${esc(r.name)}</span>${r.need
          ? `<span class="wt${late ? ' late' : ''}">${ago(r.ts)}待ち</span>` : `<span class="tm">${fmt(r.ts)}</span>`}${r.unread ? `<span class="ub">${r.unread > 99 ? '99+' : r.unread}</span>` : ''}</div>
        <div class="pv">${who}${esc(r.last)}</div>
        ${FILTER === 'pend' ? pendTag(r.pend) : ''}
      </div>
    </div>`;
}


// ---------- 女の子の情報・判定 ----------
const JUDGES = [['リピ大あり', 'j-big'], ['リピあり', 'j-yes'], ['リピなし', 'j-no'], ['出禁', 'j-ban']];
function judgeTag(j) { const c = (JUDGES.find(x => x[0] === j) || [])[1] || ''; return '<span class="tag jt ' + c + '">' + esc(j) + '</span>'; }
function curRow() { return DATA && CUR ? DATA.rows.find(r => r.user === CUR) : null; }
function judgeBtns(cur) {
  return JUDGES.map(x => `<button class="jb ${x[1]}${cur === x[0] ? ' on' : ''}" onclick="setJudge('${x[0]}')">${x[0]}</button>`).join('');
}
function renderJudgeBar() {
  const rw = curRow(), el = document.getElementById('tJudge');
  if (!rw || !rw.needJudge) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'block';
  el.innerHTML = '<div class="jq">出勤おつかれさまでした。判定は？</div><div class="jbs">' + judgeBtns('') + '</div>';
}
// ワンタップで送る(2026-11-11 オーナー指示: 客が来たら「お願いします！」、オプション・預かり金額が分かったらクマのペコリ)
const BOW = '[[sticker:11537:52002739]]';
function quickSend(x) { doSend([x], false); }
// 一覧の3行目：色つきの札は「無料・案あり・判定・手動」だけ。日程・プロフィール・段階はグレーの文字で1行に(2026-11-11 オーナー指示：ごちゃごちゃを整理)
function metaLine(r, st) {
  const badges = freeBadge(r.rt) + st
    + (r.needJudge ? '<span class="st st-judge">⭐ 判定まだ</span>' : '') + (r.judge ? judgeTag(r.judge) : '')
    + (r.mode === 'manual' ? '<span class="tag t-manual">✋ 手動</span>' : '');
  const when = r.today ? '<b style="color:#06a84a">🟢 本日出勤</b>' : r.dates ? '📅 ' + esc(r.dates) + (r.pend && r.pend.days != null && r.pend.days > 0 ? '（あと' + r.pend.days + '日）' : '') : '';
  // 受入れ未の人は段階(〜の返事待ち)を出さない。やることの行と同じ内容なので
  const txt = [when, r.info ? esc(r.info) : '', r.pend ? '' : esc(r.stage || '')].filter(Boolean).join('<span class="dot">｜</span>');
  return (badges ? '<div class="tags">' + badges + '</div>' : '') + (txt ? '<div class="meta">' + txt + '</div>' : '');
}
// 受け入れ体制がまだの人(オレンジの札。出勤が近いほど赤)
function pendTag(p) {
  if (!p) return '';

  // 受け入れ体制⭕️までにやることを1行の文字で出す。出勤まで2日以内は赤
  const todo = { '時間': '出勤時間', '源氏名': '源氏名', '店泊': '店泊', 'インターバル': 'インターバル', '写真': '写真' };
  const soon = p.days != null && p.days <= 2;
  return `<div class="ptodo${soon ? ' soon' : ''}">⚠️ 受入れ⭕️に足りない：${p.lack.length ? p.lack.map(x => esc(todo[x] || x)).join('・') : '台帳に⭕️を付けるだけ'}${soon ? '（出勤' + (p.days <= 0 ? '本日' : 'あと' + p.days + '日') + '）' : ''}</div>`;
}
// 未読の数(LINEと同じ緑の丸)。開いたら既読にして、LINEにも既読を伝える。合計はタイトルとアイコンに出す
function totalUnread() { return DATA ? DATA.rows.reduce((a, r) => a + (r.unread || 0), 0) : 0; }
function updateBadge() {
  const n = totalUnread();
  document.title = n ? '(' + n + ') エステ返信' : 'エステ返信';
  try { if (navigator.setAppBadge) { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } } catch (e) {}
  const b = document.getElementById('bell');
  if (b) b.style.display = 'none'; // ボタンは出さない。見出しをタップで許可(2026-11-11)
}
async function askBadge() { try { await Notification.requestPermission(); } catch (e) {} updateBadge(); }
function markRead(uid) {
  const rw = DATA && DATA.rows.find(r => r.user === uid);
  if (!rw || !rw.unread || document.hidden) return;
  rw.unread = 0; updateBadge(); cachePut('list', DATA);
  call('ibxRead', uid).catch(() => {});
}
// スタンプ・画像の吹き出し
const IMG = {};
function bubble(m) {
  const st = /^\[\[sticker:\d+:(\d+)\]\]$/.exec(m.x || '');
  if (st && !m.s) m = Object.assign({}, m, { s: st[1] });
  if (m.s) return `<div class="b media"><img class="stk" src="https://stickershop.line-scdn.net/stickershop/v1/sticker/${encodeURIComponent(m.s)}/android/sticker.png" alt="スタンプ" onerror="this.parentNode.textContent='［スタンプ］'"></div>`;
  if (m.u) return `<div class="b media"><img class="pic" src="${esc(m.u)}" onclick="bigImg(this.src)" alt="写真"></div>`;
  if (m.i) return `<div class="b media"><img class="pic" data-img="${esc(m.i)}" src="${IMG[m.i] && IMG[m.i].startsWith('data:') ? IMG[m.i] : ''}" onclick="bigImg(this.src)" alt="写真"></div>`;
  return `<div class="b">${esc(m.x)}</div>`;
}
function loadImgs() {
  document.querySelectorAll('img[data-img]').forEach(el => {
    const id = el.dataset.img;
    if (IMG[id] === 'x') { el.parentNode.textContent = '［写真（期限切れで表示できません）］'; return; }
    if (IMG[id] === 'loading') return;
    if (IMG[id]) { if (!el.getAttribute('src')) el.src = IMG[id]; return; }
    IMG[id] = 'loading';
    call('ibxImg', id).then(r => { IMG[id] = r.ok ? r.src : 'x'; loadImgs(); }).catch(() => { delete IMG[id]; });
  });
}
function bigImg(src) { if (!src) return; const o = document.createElement('div'); o.className = 'bigimg'; o.innerHTML = '<img src="' + src + '">'; o.onclick = () => o.remove(); document.body.appendChild(o); }
// 無料で返せる残り秒数(届いてから50秒。1秒ずつ減らす)
const FREE_SEC = 50;
function freeLeft(ts) { return ts ? Math.floor(FREE_SEC - (Date.now() - ts) / 1000) : 0; }
function freeBadge(ts) { const l = freeLeft(ts); return l > 0 ? `<span class="freeb${l <= 15 ? ' low' : ''}" data-rt="${ts}">⚡無料 あと${l}秒</span> ` : ''; }
setInterval(() => {
  document.querySelectorAll('.freeb').forEach(el => {
    const l = freeLeft(+el.dataset.rt);
    if (l <= 0) el.remove(); else { el.textContent = '⚡無料 あと' + l + '秒'; el.classList.toggle('low', l <= 15); }
  });
}, 1000);
// 自動・手動の切りかえ(ワンタップ)
function curMode() { const rw = curRow(); return (rw && rw.mode) || (T && T.mode) || 'auto'; }
function renderMode() {
  const el = document.getElementById('tMode'), m = curMode();
  el.className = 'modeb ' + m; el.textContent = m === 'manual' ? '✋ 手動' : '🤖 自動';
  // 受入れ未の人: 台帳で足りない項目の質問からボットを再開するボタン(2026-11-11)
  const rw = curRow(), b = document.getElementById('qResume');
  if (rw && rw.pend) { b.style.display = ''; b.textContent = rw.ask === '完了' ? '✅ 受入れ⭕️にする' : '▶ 続きを聞く（' + rw.ask + '）'; }
  else b.style.display = 'none';
}
let resumeBusy = false;
async function resumeAsk() {
  const rw = curRow(); if (!rw || !rw.pend || resumeBusy) return;
  const msg = rw.ask === '完了' ? rw.name + 'さんを受け入れ体制⭕️にします（相手には何も送りません）。よろしいですか？'
    : rw.name + 'さんに「' + rw.ask + '」の質問を送って、ボットを自動に戻します。よろしいですか？';
  if (!confirm(msg)) return;
  resumeBusy = true; toast('送っています…', 3000);
  try {
    const r = await call('ibxResume', rw.user);
    if (!r.ok) { toast('できませんでした: ' + r.reason, 4500); return; }
    toast(r.sent ? '「' + r.label + '」の質問を送りました' : r.label + 'にしました', 3500);
    rw.mode = 'auto'; rw.held = false; if (T) T.mode = 'auto';
    renderMode(); loadAll && loadAll();
  } catch (e) { toast('できませんでした: ' + e.message, 4500); }
  finally { resumeBusy = false; }
}
async function toggleMode() {
  const rw = curRow(); if (!rw || modeBusy) return;
  const to = curMode() === 'manual' ? 'auto' : 'manual', before = rw.mode;
  modeBusy = true; rw.mode = to; if (T) T.mode = to; renderMode();
  toast(to === 'manual' ? '手動にしました（ボットは返しません）' : '自動にしました（次に相手から来たらボットが返します）', 3000);
  try { const r = await call('ibxSetMode', rw.user, to); rw.mode = r.mode; rw.stage = r.stage; if (T) { T.mode = r.mode; T.stage = r.stage; } if (CUR === rw.user) render(); cachePut('list', DATA); }
  catch (e) { rw.mode = before; if (T) T.mode = before; renderMode(); toast('切りかえられませんでした: ' + e.message, 4000); }
  finally { modeBusy = false; }
}
let modeBusy = false;
async function setJudge(j) {
  const rw = curRow(); if (!rw) return;
  if (j === '出禁' && !confirm(rw.name + ' を出禁にしますか？')) return;
  if (rw.judge === j) j = ''; // 同じのをもう一度押したら外す
  const before = { judge: rw.judge, needJudge: rw.needJudge };
  rw.judge = j; rw.needJudge = false;
  renderJudgeBar(); if (document.getElementById('prof').style.display === 'flex') renderProf(); toast(j ? '「' + j + '」にしました' : '判定を外しました');
  try { await call('ibxJudge', rw.user, j); cachePut('list', DATA); }
  catch (e) { Object.assign(rw, before); renderJudgeBar(); toast('保存できませんでした: ' + e.message, 4000); }
}
let PHOTOS = {};
function openProf() {
  if (!T) return;
  document.getElementById('prof').style.display = 'flex';
  renderProf();
  if (!PHOTOS[CUR]) { const u = CUR; PHOTOS[u] = 'loading'; call('ibxPhotos', u).then(r => { PHOTOS[u] = r.photos || []; if (CUR === u) renderProf(); }).catch(() => { PHOTOS[u] = []; if (CUR === u) renderProf(); }); }
}
function closeProf() { document.getElementById('prof').style.display = 'none'; }
function renderProf() {
  const t = T, rw = curRow() || {};
  const ph = PHOTOS[CUR];
  const photos = ph === 'loading' ? '<div class="pnote">写真を読み込み中…</div>' : ph && ph.length ? '<div class="pph">' + ph.map(u => `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy"></a>`).join('') + '</div>' : '<div class="pnote">写真はまだありません</div>';
  const rows = (t.prof || []).map(x => `<div class="pr"><div class="pk">${esc(x[0])}</div><div class="pv2">${esc(x[1])}</div></div>`).join('') || '<div class="pnote">台帳の情報がありません</div>';
  const d = t.data || {};
  const kv = (k, v) => v ? `<div class="pr"><div class="pk">${esc(k)}</div><div class="pv2">${esc(v)}</div></div>` : '';
  const pend = rw.pend ? `<div class="ptodo${rw.pend.days != null && rw.pend.days <= 2 ? ' soon' : ''}">受入れ⭕️に足りない：${esc(rw.pend.lack.join('・') || '台帳に⭕️を付けるだけ')}</div>` : '';
  document.getElementById('pBody').innerHTML = `<div class="phero"><div class="av" id="pAv"></div><div class="pnm">${esc(t.name)}</div>
      <div class="psub">${esc([t.today ? '出勤中' : t.dates ? '次回 ' + t.dates : '', rw.info || ''].filter(Boolean).join('　'))}</div></div>
    ${pend}
    ${photos}
    <div class="psec">やりとり</div>
    ${kv('段階', t.stage)}${kv('源氏名', d['源氏名'])}${kv('出勤時間', d['出勤時間帯'])}${kv('店泊', d['店泊'])}${kv('インターバル', d['インターバル'])}${kv('LINE名', t.ln)}
    <div class="psec">台帳</div>${rows}
    <div class="psec">判定</div><div class="jbs">${judgeBtns(rw.judge || '')}</div>
    ${t.drive ? `<a class="plink" href="${esc(t.drive)}" target="_blank">Driveのフォルダを開く ›</a>` : ''}`;
  avatar(document.getElementById('pAv'), t.pic, t.name);
}

// ---------- やりとり ----------
function openThread(uid, quiet) {
  if (CUR !== uid) { editing = false; noteOpen = false; document.getElementById('tText').value = ''; }
  CUR = uid;
  if (location.hash !== '#' + uid) history.pushState(null, '', '#' + uid);
  document.getElementById('list').style.display = 'none';
  document.getElementById('guide').style.display = 'none';
  document.getElementById('thread').style.display = 'flex';
  if (TH[uid]) { if (!(quiet && editing)) { T = Object.assign({}, TH[uid], { quota: DATA && DATA.quota }); render(); } }
  else { document.getElementById('tMsgs').innerHTML = '<div class="empty">読み込み中…</div>'; }
  markRead(uid);
  if (!quiet) loadAll();
}

function render() {
  const t = T;
  // 見出しは名前と次回出勤だけ(LINEと同じ高さ)。ほかの情報は「情報」ページへ(2026-11-11 オーナー指示)
  document.getElementById('tName').textContent = t.name;
  document.getElementById('tNext').textContent = t.today ? '出勤中' : t.dates ? t.dates : '';
  document.getElementById('tNext').className = 'nd' + (t.today ? ' on' : '');
  renderJudgeBar(); renderMode();
  document.getElementById('tFree').innerHTML = freeBadge((curRow() || {}).rt);
  let html = '', lastDay = '';
  if (!t.hist.length) html += '<div class="empty">このページを作る前のやりとりは出ません</div>';
  t.hist.forEach(m => {
    const dl = dayLabel(m.t);
    if (dl !== lastDay) { html += '<div class="day">' + dl + '</div>'; lastDay = dl; }
    const side = m.d === 'in' ? 'l' : 'r' + (m.d === 'bot' ? ' bot' : '');
    html += `<div class="bl ${side}"${m.pending ? ' style="opacity:.55"' : ''}>${bubble(m)}<div class="bt">${m.d === 'bot' ? 'ボット<br>' : ''}${m.pending ? '送信中' : hm(m.t)}</div></div>`;
  });
  html += cardHtml(t);
  const box = document.getElementById('tMsgs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = html;
  loadImgs();
  if (atBottom || !editing) box.scrollTop = box.scrollHeight;
}

let noteOpen = false;
function cardHtml(t) {
  if (!t.need) return '';
  const lastIn = [...t.hist].reverse().find(m => m.d === 'in');
  let h = `<div class="card"><div class="card-h">🤖 返信案${t.dts ? '（' + (new Date(t.dts).toDateString() === new Date().toDateString() ? '' : fmt(t.dts) + ' ') + hm(t.dts) + '）' : ''}</div>`;
  // 相手の文はやりとりに出ているので、カードには出さない(2026-11-10 オーナー指示)
  if (t.drafting) return h + '<div class="note">AIが返信案を作っています（Macが動いていれば1〜2分）</div></div>';
  // 目的とメモは出さない(2026-11-10 オーナー指示)
  const msgs = t.dmsgs || [];
  if (!msgs.length && !editing) {
    h += '<div class="card-q" style="margin-top:10px">送る文はありません（返事は不要そう）。必要なら「修正」で書けます。</div>';
  }
  const list = editing ? (msgs.length ? msgs : ['']) : msgs;
  list.forEach((m, i) => {
    h += `<div class="nth">${i + 1}通目</div>` + (editing
      ? `<textarea class="em" rows="${Math.min(10, Math.max(2, m.split('\n').length + 1))}">${esc(m)}</textarea>`
      : `<div class="mtext">${esc(m)}</div>`);
  });
  if (editing && list.length < 4) h += '<div class="sub-btns"><a onclick="addMsg()">＋ 1通追加</a></div>';
  if (t.canResume) h += `<label class="resume"><input type="checkbox" id="resume" ${t.dresume === false ? '' : 'checked'}><span>送ったあと、ボットの質問に戻る（「${esc(t.resumeQ.slice(0, 40))}…」を続けて送る）</span></label>`;
  h += `<div class="cbtns">
      <button class="cb send" onclick="sendDraft()" ${busy ? 'disabled' : ''}>送信</button>
      <button class="cb" onclick="toggleEdit()">${editing ? '完了' : '修正'}</button>
      <button class="cb" onclick="discard()">破棄</button>
      <span class="qinfo">${t.freeLeft > 0 ? '今なら無料' : esc(quotaText(t.quota))}</span>
    </div>
    <div class="sub-btns"><a onclick="copyDraft()">コピーしてアプリから送る</a><a onclick="dismiss()">返信不要にする</a></div></div>`;
  return h;
}

function readEdits() {
  if (!editing) return;
  T.dmsgs = [...document.querySelectorAll('.em')].map(x => x.value);
}
function toggleEdit() { readEdits(); editing = !editing; if (!editing) T.dmsgs = (T.dmsgs || []).map(s => s.trim()).filter(Boolean); render(); }
function addMsg() { readEdits(); T.dmsgs = (T.dmsgs || []).concat(['']); render(); }

// 押した瞬間に画面に出し、裏で送る。送れなかったら元に戻す
async function doSend(msgs, resume) {
  if (busy) return;
  msgs = msgs.map(s => s.trim()).filter(Boolean);
  if (!msgs.length) { toast('文が空です'); return; }
  const uid = CUR, before = JSON.parse(JSON.stringify(T)), now = Date.now();
  busy = true; editing = false;
  T.hist = T.hist.concat(msgs.map((x, i) => ({ t: now + i, d: 'me', x: x, pending: 1 })));
  T.need = false; T.dmsgs = []; T.draft = '';
  const keepText = document.getElementById('tText').value; document.getElementById('tText').value = '';
  render();
  try {
    const r = await call('ibxSend', uid, msgs, resume);
    busy = false;
    if (!r.ok) throw new Error(r.reason);
    T.hist.forEach(m => delete m.pending); if (CUR === uid) render();
    toast('送りました（' + r.how + '）' + (r.resumed ? '。ボットの質問に戻りました' : ''));
    if (r.quota && DATA) DATA.quota = r.quota;
    loadAll();
  } catch (e) {
    busy = false;
    if (CUR === uid) { T = before; document.getElementById('tText').value = keepText; render(); }
    toast('送れませんでした: ' + e.message, 5000);
  }
}
function sendDraft() {
  readEdits();
  const r = document.getElementById('resume');
  doSend(T.dmsgs || [], r ? r.checked : false);
}
function sendFree() {
  const s = document.getElementById('tText').value;
  const r = document.getElementById('resume');
  doSend([s], r ? r.checked : false);
}
async function discard() {
  editing = false; T.dmsgs = []; T.purpose = ''; T.note = '';
  render();
  document.getElementById('tText').focus();
  toast('案を消しました。下の入力欄から書けます');
}
async function redraft() {
  editing = false; T.dmsgs = []; T.draft = ''; T.drafting = true; render();
  toast('AIに案を作り直してもらっています');
  try { await call('ibxRedraft', CUR); } catch (e) { toast('できませんでした: ' + e.message, 4000); }
  loadAll();
}
async function dismiss() {
  const uid = CUR; toast('返信不要にしました');
  if (TH[uid]) TH[uid].need = false; if (DATA) DATA.rows.forEach(r => { if (r.user === uid) r.need = false; });
  closeThread();
  try { await call('ibxDismiss', uid); } catch (e) { toast('できませんでした: ' + e.message, 4000); }
  loadAll();
}
function copyText(s) {
  const ta = document.getElementById('tText'), keep = ta.value;
  try { ta.value = s; ta.focus(); ta.setSelectionRange(0, s.length); const ok = document.execCommand('copy'); ta.value = keep; if (ok) return Promise.resolve(); } catch (e) { ta.value = keep; }
  return navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject();
}
async function copyDraft() {
  readEdits();
  const s = (T.dmsgs || []).join('\n\n').trim();
  if (!s) { toast('文が空です'); return; }
  try { await copyText(s); toast('コピーしました。アプリで送ったら「返信不要にする」を押してください', 3500); } catch (e) { toast('コピーできませんでした'); }
}

function closeThread() {
  closeProf();
  CUR = null; editing = false; clearTimeout(timer);
  document.getElementById('thread').style.display = 'none';
  document.getElementById('list').style.display = 'block';
  if (location.hash) history.pushState(null, '', location.pathname + location.search);
  renderList(); loadAll();
}
window.addEventListener('popstate', () => { const h = location.hash.slice(1); h === 'guide' ? openGuide() : h ? openThread(h) : (closeGuide(true), closeThread()); });

// ---------- ルーム案内 ----------
let G = null;
async function openGuide() {
  CUR = null; clearTimeout(timer);
  if (location.hash !== '#guide') history.pushState(null, '', '#guide');
  document.getElementById('list').style.display = 'none';
  document.getElementById('thread').style.display = 'none';
  document.getElementById('guide').style.display = 'block';
  try { G = await call('rgList'); renderGuide(); } catch (e) { document.getElementById('gBody').innerHTML = '<div class="empty">読み込めませんでした: ' + esc(e.message) + '</div>'; }
}
function closeGuide(quiet) {
  document.getElementById('guide').style.display = 'none';
  if (quiet) return;
  document.getElementById('list').style.display = 'block';
  if (location.hash) history.pushState(null, '', location.pathname + location.search);
  loadList();
}
const RG_LABEL = { wait: '確認待ち', ok: '送る（予約済み）', skip: '送らない', sent: '送信済み', noline: '公式LINE未連携（送れません）', gone: 'シフトが消えました', error: '送れませんでした' };
function renderGuide() {
  const g = G;
  const rows = g.rows.length ? g.rows.map(r => `
    <div class="gi">
      <div class="nm">${esc(r.name)}</div>
      <div class="st">${r.md}から出勤・ルーム${r.room}　<b>${RG_LABEL[r.status] || r.status}</b></div>
      ${r.canSend && r.status !== 'sent' && r.status !== 'gone' ? `<div class="cbtns">
        <button class="cb send" ${r.status === 'ok' ? 'disabled' : ''} onclick="rgDecide('${r.key}', true)">${g.late && r.tomorrow ? '今すぐ送る' : g.sendHour + '時に送る'}</button>
        <button class="cb" ${r.status === 'skip' ? 'disabled' : ''} onclick="rgDecide('${r.key}', false)">送らない</button></div>` : ''}
    </div>`).join('') : '<div class="empty">明日から新しく出勤する人はいません<br><span style="font-size:13px">17時以降にキャスカンのシフトを見て出します</span></div>';
  const prev = ['A', 'B'].map(k => g.guides[k] ? `<div style="margin:16px 12px 0;font-weight:800">ルーム${k}の案内文</div><div class="gprev">${esc(g.guides[k].text)}</div><div class="gimgs">${g.guides[k].images.map(u => '<img src="' + esc(u) + '">').join('')}</div>` : `<div class="gprev">ルーム${k}の案内文が未設定です</div>`).join('');
  document.getElementById('gBody').innerHTML = rows + prev;
}
async function rgDecide(key, send) {
  try { const r = await call('rgDecide', key, send); toast(r.status === 'sent' ? '送りました' : send ? (G.late ? '送ります' : G.sendHour + '時に送ります') : '送らないにしました'); G = await call('rgList'); renderGuide(); }
  catch (e) { toast('できませんでした: ' + e.message, 4000); }
}

if (!K) { document.body.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#555;line-height:1.7">このページを開くには、通知にあるリンクから開いてください。</div>'; throw 0; }
loadList();
// 1秒ごとに「変わった？」を聞く。変わっていれば同じ返事で中身も届く(往復1回)。念のため15秒ごとにも全部読む
let VER = null, lastFull = Date.now(), verBusy = false;
setInterval(async () => {
  if (document.hidden || verBusy || loading || editing || modeBusy) return; // 送信中も新着は見に行く
  verBusy = true;
  try {
    const force = Date.now() - lastFull > 15000;
    const have = {}; Object.keys(TH).forEach(u => have[u] = TH[u].sig);
    const r = await call('ibxPoll', force ? 'x' : VER, have);
    VER = r.ver;
    if (r.all && !editing && !modeBusy) { lastFull = Date.now(); applyAll(r.all); }
  } catch (e) {} finally { verBusy = false; }
}, 1000);
window.addEventListener('focus', () => loadAll());
window.addEventListener('pageshow', () => loadAll());
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(); }); // アプリに戻ったらすぐ最新に
if (OPEN_USER) openThread(OPEN_USER);
else if (location.hash === '#guide') openGuide();
else if (location.hash.length > 1) openThread(location.hash.slice(1));
</script>
