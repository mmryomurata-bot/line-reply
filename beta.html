<style>
  :root { --bg:#f6f3ee; --card:#fffdf8; --line:#e8e1d6; --ink:#2b2622; --sub:#8a8178; --red:#c0392b; --gold:#d4a73a;
          --pink:#f9e3ea; --pinkink:#b0365d; --blue:#e3eefb; --blueink:#2d5f9a; --purple:#ece6fb; --purpleink:#5b3fb0;
          --gray:#efece7; --grayink:#6d655d; --me:#cfe0f5; --draft:#b3262e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:16px; }
  header { position:sticky; top:0; z-index:5; background:#fff; padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:22px; font-weight:800; }

  .search { margin-top:10px; width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:#fafafa; }
  .tabs { display:flex; gap:6px; margin-top:10px; }

  .tabs button .n { font-weight:800; margin-left:3px; }
  .summary { margin:8px 10px; padding:9px 13px; background:#fff3f0; border:1px solid #f0c9c0; border-radius:14px; color:#8a2c1f; font-size:14px; line-height:1.6; }
  .summary b { font-size:16px; }
  .sec { display:flex; justify-content:space-between; padding:16px 18px 6px; font-size:13px; font-weight:800; color:var(--sub); letter-spacing:.05em; }
  .sec span { font-weight:700; }
  .row { display:flex; gap:12px; padding:13px 14px; margin:8px 10px; border-radius:14px; background:#fff; cursor:pointer; position:relative; border:1px solid var(--line); }
  .row:active { background:#f4f1ec; }
  .row.need { border:2px solid #e2b53e; background:#fffbef; box-shadow:0 2px 6px rgba(160,120,20,.12); }
  .av { width:50px; height:50px; border-radius:50%; background:#c9b9a6 center/cover; flex:none; display:flex; align-items:center; justify-content:center; font-size:21px; color:#fff; font-weight:700; }
  .mid { flex:1; min-width:0; }
  .top { display:flex; align-items:center; gap:8px; }
  .nm { font-weight:800; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .row:not(.need) .nm { font-weight:700; color:#4a433d; }
  .ln { font-size:12px; color:var(--sub); }
  .tm { font-size:13px; color:var(--sub); flex:none; }
  .wt { flex:none; font-size:12.5px; font-weight:800; color:#8a5a00; background:#fbe7b0; border-radius:20px; padding:2px 9px; }
  .wt.late { background:var(--red); color:#fff; }
  .pv { font-size:15px; line-height:1.45; margin:4px 0 7px; color:#2b2622; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; }
  .row:not(.need) .pv { color:var(--sub); font-size:14px; -webkit-line-clamp:1; }
  .who { font-weight:700; color:var(--sub); margin-right:5px; font-size:12.5px; }
  .tags { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .tag { font-size:12px; padding:2px 9px; border-radius:20px; border:1px solid transparent; font-weight:600; }
  .st { font-size:12.5px; font-weight:800; padding:3px 10px; border-radius:8px; }
  .st-ok { background:#6a4bc4; color:#fff; } .st-low { background:#efece7; color:#6d655d; }
  .t-red { background:var(--pink); color:var(--pinkink); } .t-blue { background:var(--blue); color:var(--blueink); }
  .t-purple { background:var(--purple); color:var(--purpleink); } .t-gray { background:var(--gray); color:var(--grayink); }
  .t-draft { background:#6a4bc4; color:#fff; } .t-today { background:#1f9d55; color:#fff; } .t-dates { background:#fff; color:#2f7a3b; border-color:#bfe3c8; } .t-ai { background:#fff; color:var(--sub); border-color:var(--line); }
  .empty { text-align:center; color:var(--sub); padding:40px 16px; }

  /* やりとり */

  .bl.l .b { background:#eeeeee; border-top-left-radius:6px; }
  .bl.r .b { background:var(--me); border-top-right-radius:6px; }
  .bl.r.bot .b { background:#e6eef8; }
  .bt { font-size:11px; color:var(--sub); flex:none; text-align:right; line-height:1.3; }
  .card { border:2px solid var(--draft); border-radius:16px; padding:12px 14px; margin:16px 0 6px; background:#fbfbfb; }
  .card-h { font-weight:800; font-size:15px; color:#444; }
  .card-q { font-size:13px; color:var(--sub); margin-top:6px; line-height:1.5; }
  .purpose { background:#e9f6ea; color:#2f7a3b; font-weight:800; border-radius:10px; padding:7px 11px; margin-top:8px; font-size:13.5px; line-height:1.5; }
  .card-in { background:#f1f1f1; border-radius:12px; padding:8px 11px; margin-top:8px; }
  .ci { font-size:15px; line-height:1.5; color:#222; white-space:pre-wrap; padding:2px 0; }
  .cit { font-size:11px; color:var(--sub); margin-right:6px; }
  .note.shut { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .more { font-size:12.5px; color:#7a5200; margin-top:3px; text-align:right; }
  .note { background:#fff6dd; color:#7a5200; border-radius:10px; padding:8px 11px; margin-top:8px; font-size:13.5px; line-height:1.5; }
  .nth { font-size:12px; color:var(--sub); margin-top:12px; }
  .mtext { white-space:pre-wrap; line-height:1.6; font-size:15.5px; margin-top:3px; }
  .card textarea { width:100%; font-size:16px; padding:8px; border:1px solid var(--line); border-radius:8px; font-family:inherit; margin-top:3px; }
  .resume { display:flex; gap:8px; align-items:flex-start; font-size:13.5px; margin-top:12px; color:#444; line-height:1.5; }
  .resume input { width:20px; height:20px; flex:none; margin-top:1px; }
  .cbtns { display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  .cb { padding:10px 18px; border-radius:12px; border:1px solid #ddd; background:#fff; font-size:16px; font-weight:800; color:var(--ink); }
  .cb.send { background:var(--draft); border-color:var(--draft); color:#fff; }
  .cb:disabled { opacity:.5; }
  .qinfo { font-size:12px; color:var(--sub); margin-left:auto; }
  .sub-btns { display:flex; gap:14px; margin-top:10px; font-size:13px; }
  .sub-btns a { color:var(--sub); text-decoration:underline; cursor:pointer; }
  .composer { background:#fff; border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:flex-end; }
  .composer textarea { flex:1; min-height:42px; max-height:none; overflow-y:hidden; line-height:1.4; font-size:16px; padding:9px 12px; border:1px solid #ccc; border-radius:12px; font-family:inherit; resize:none; }
  .icon { font-size:26px; background:none; border:0; padding:4px; line-height:1; }
  .sendb { font-size:24px; color:#7a8aa8; background:none; border:0; padding:6px; }
  .rgbar { margin:10px 10px 0; padding:10px 13px; background:#eef4ff; border:1px solid #c9d8f3; border-radius:14px; color:#24477a; font-size:15px; font-weight:700; cursor:pointer; }
  #guide { display:none; min-height:100vh; background:var(--bg); }
  .gi { background:#fff; margin:12px; border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .gi .nm { font-size:17px; }
  .gi .st { font-size:13px; color:var(--sub); margin-top:4px; }
  .gprev { white-space:pre-wrap; font-size:13.5px; line-height:1.55; color:#444; background:#fafafa; border-radius:10px; padding:10px; margin:10px 12px; border:1px solid var(--line); }
  .gimgs { display:flex; gap:6px; margin:0 12px 12px; } .gimgs img { width:31%; border-radius:8px; }
  .toast { position:fixed; left:50%; bottom:30%; transform:translateX(-50%); background:rgba(30,30,30,.92); color:#fff; padding:12px 18px; border-radius:12px; font-size:15px; display:none; z-index:20; max-width:85%; text-align:center; }

  /* ---- LINE風の色(2026-11-10 オーナー指示) ---- */
  :root { --lg:#06c755; --lgd:#05b34c; --ink:#111; --sub:#8c8c8c; --line:#ececec; --bg:#fff; --draft:#06c755; --me:#8de055; }

  .wt { background:var(--lg); color:#fff; font-weight:700; border-radius:20px; }

  .tm { font-size:12px; color:#9a9a9a; }

  .t-gray, .t-purple, .t-red, .t-blue { background:#f2f3f5; color:#666; }

  /* やりとり */
  #thread { background:#8cabd8; }
  .th-head { background:#fff; border-bottom:0; }
  .chips { background:#fff; border-bottom:1px solid #e3e3e3; }

  .day { color:#fff; }

  .bl.l .b { background:#fff; border-radius:18px; border-top-left-radius:4px; }

  /* 女の子の情報・判定 */
  .tabs button { font-size:13px; }
  /* タブの件数は色つきの丸。0件のタブは薄くする(2026-11-11 オーナー了承) */
  /* 件数はタブ名の真上に乗せる(左右どちらの数か迷わないように。2026-11-11 オーナー指示) */
  .tabs button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; white-space:nowrap; padding:7px 0 7px; }
  .tabs button .n { display:inline-block; min-width:19px; height:19px; line-height:19px; padding:0 5px; border-radius:10px; font-size:11.5px; font-weight:800; color:#fff; margin-left:0; box-sizing:border-box; }
  .tabs .c-red .n { background:#ff3b30; } .tabs .c-org .n { background:#ff9500; } .tabs .c-yel .n { background:#f5b800; }
  .tabs .c-grn .n { background:#06c755; } .tabs .c-gry .n { background:#b8b8b8; }
  .tabs button.zero { opacity:.4; } .tabs button.zero .n { background:#c8c8c8; }
  .tabs button.on { opacity:1; }
  .ptodo { margin-top:5px; font-size:13px; font-weight:700; color:#c26a00; background:#fff6e8; border-radius:8px; padding:5px 9px; line-height:1.4; }
  .ptodo.soon { color:#fff; background:#ff3b30; }
  .meta { margin-top:4px; font-size:12.5px; color:#8c8c8c; line-height:1.45; }
  .meta .dot { color:#d0d0d0; margin:0 4px; }
  .row .tags { margin-top:5px; } .row .tags:empty { display:none; }
  .plbl { font-size:11.5px; color:#b35c00; font-weight:700; }
  .pchip { display:inline-block; background:#fff; color:#b35c00; border:1px solid #ffc978; border-radius:10px; padding:1px 7px; font-size:11.5px; font-weight:700; margin-right:3px; }
  .t-info { background:#fff; color:#555; border-color:#e2e2e2; }
  .st-judge { background:#fff4d6; color:#9a6a00; }
  .jt { font-weight:700; } .j-big { background:#1b73e8 !important; color:#fff !important; } .j-yes { background:var(--lg) !important; color:#fff !important; }
  .j-no { background:#9a9a9a !important; color:#fff !important; } .j-ban { background:#e53935 !important; color:#fff !important; }

  .bigimg img { max-width:100%; max-height:100%; }
  .ub { flex:none; margin-left:6px; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:#06c755; color:#fff; font-size:12px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }

  .pend.soon { background:#ff3b30; color:#fff; border-color:#ff3b30; }

<script>
const API = 'https://script.google.com/macros/s/AKfycbx_XYcMu-bVYr0m_EMUK7hRYI7pmIhqvnsqWokKAOHgWCg-knkKedJbjbmihQIDVMpp/exec';
const HP = new URLSearchParams(location.hash.slice(1));
let K = HP.get('k') || new URLSearchParams(location.search).get('k');
try { if (K) localStorage.setItem('ibx_k', K); else K = localStorage.getItem('ibx_k'); } catch (e) {}
// 合言葉はURLの ?k= に残す(ホーム画面のアイコンは別の保存場所になるため)。#以降は開く人だけ
if (K && HP.get('k')) history.replaceState(null, '', location.pathname + '?k=' + encodeURIComponent(K) + (HP.get('u') ? '#' + HP.get('u') : ''));
window.onerror = (m, src, line) => { toast('エラー: ' + m + ' (' + line + ')', 6000); };
let DATA = null, CUR = null, T = null, timer = null, editing = false, busy = false;
const OPEN_USER = '';
let FILTER = 'need';
try { FILTER = localStorage.getItem('ibxFilter2') || 'need'; } catch (e) {}
setTimeout(() => { buildTabs(); if (DATA) renderList(); }, 0); // 下のメニューと上のタブを作る
// 下のメニュー: トーク(やりとり) と 女性(受入れ・判定・出勤の情報) を切りかえ(2026-11-11 オーナー指示: LINEの下のメニューのように)
// 2026-11-11 オーナー指示: トークは出勤中がいちばん左。女性は 出勤済み・未出勤・その他 を先に、受入れ未などは右へ
// 同日: 受入れ未・判定待ち・すべてはトーク側へ(オーナー指示)
const VIEWS = { talk: [['today', '出勤中', 'c-grn'], ['need', '返事待ち', 'c-red'], ['pend', '受入れ未', 'c-org'], ['judge', '判定待ち', 'c-yel'], ['all', 'すべて', 'c-gry']],
  girls: [['done', '出勤済み', 'c-grn'], ['noshow', '未出勤', 'c-gry'], ['other', 'その他', 'c-gry']] };
const picOf = r => (r && r.cs && r.cs.panel) || (r && r.pic) || ''; // 写真はパネル写真(キャスカン)を優先
const OTHER_ST = ['流れ', '受け入れ不可', '日程合わず', '未出勤']; // 台帳の「未出勤」は来なかった人なのでその他へ
const todayJ = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
// 出勤済み: 台帳が「出勤」、または⭕️で日程が過ぎた人。未出勤: 日程がこれから(今日出勤中の人は除く)
function gDone(r) { return r.ls === '出勤' || (r.ls === '受け入れ体制⭕️' && !!r.ld && r.ld < todayJ()); }
function gUpcoming(r) { return !r.today && !!r.ld && r.ld >= todayJ() && OTHER_ST.indexOf(r.ls) === -1 && r.ls !== '出勤'; }
function gOther(r) { return OTHER_ST.indexOf(r.ls) !== -1; }
const JRANK = { 'リピ大あり': 0, 'リピあり': 1, 'リピなし': 2, '出禁': 3 };
let GSORT = 'new';
try { GSORT = localStorage.getItem('ibxGSort') || 'new'; } catch (e) {}
function setGSort(v) { GSORT = v; try { localStorage.setItem('ibxGSort', v); } catch (e) {} renderList(); }
let VIEW = 'talk';
try { VIEW = localStorage.getItem('ibxView') === 'girls' ? 'girls' : 'talk'; } catch (e) {}
function buildTabs() {
  if (VIEWS[VIEW].map(x => x[0]).indexOf(FILTER) === -1) FILTER = VIEWS[VIEW][0][0];
  document.getElementById('tabs').classList.toggle('many', VIEWS[VIEW].length > 4);
  document.getElementById('tabs').innerHTML = VIEWS[VIEW].map(x => `<button data-f="${x[0]}" data-l="${x[1]}" class="${x[2]}" onclick="setFilter('${x[0]}')">${x[1]}</button>`).join('');
  document.querySelectorAll('#bnav button').forEach(b => b.classList.toggle('on', b.dataset.v === VIEW));
  document.getElementById('vTitle').textContent = VIEW === 'talk' ? 'トーク' : '女性';
}
function setView(v) { VIEW = v; try { localStorage.setItem('ibxView', v); } catch (e) {} buildTabs(); renderList(); window.scrollTo(0, 0); }
function isGirl(r) { return !!(r.dates || r.pend || r.info || r.judge || r.needJudge); }
function girlRow(r) {
  const when = r.today ? '<span class="tm" style="color:#06a84a;font-weight:700">出勤中</span>' : !r.dates && r.ld ? '<span class="tm">' + Number(r.ld.slice(5, 7)) + '/' + Number(r.ld.slice(8, 10)) + '</span>' : r.dates ? '<span class="tm">' + esc(r.dates) + '</span>' : '';
  const sub = r.pend ? pendTag(r.pend) : r.judge && ['done', 'girls'].indexOf(FILTER) !== -1 ? '<div style="margin-top:4px">' + judgeTag(r.judge) + '</div>' : r.needJudge ? '<div class="ptodo" style="background:#fff8e1;color:#9a6a00">⭐ 判定がまだです</div>' : '';
  return `<div class="row" onclick="openWoman('${r.user}')">
      <div class="av" data-pic="${esc(picOf(r))}" data-nm="${esc(r.name)}"></div>
      <div class="mid">
        <div class="top"><span class="nm">${esc(r.name)}</span>${when}</div>
        <div class="pv">${esc(r.info || r.stage || '')}</div>${FILTER === 'done' && r.cs ? '<div class="gst">' + (r.cs.n ? r.cs.n + '本' : '0本') + (r.cs.sv != null ? '<span>・</span>アンケート ' + r.cs.sv + '点（' + r.cs.svn + '件）' : '') + '</div>' : ''}${sub}
      </div>
    </div>`;
}
// 女性タブから情報ページだけを開く(トークは開かない)
function openWoman(uid) {
  if (!TH[uid]) { toast('読み込み中です。少し待ってからもう一度'); return; }
  CUR = uid; T = Object.assign({}, TH[uid], { quota: DATA && DATA.quota });

// ---- 棒グラフ(SVG)。series: [{name,color,vals}]。1軸のみ。tip(i) でツールチップ ----
function barChart(el, cats, series, tip, opt) {
  opt = opt || {};
  const W = 340, H = 150, L = 34, B = 20, T = 8, iw = W - L - 4, ih = H - T - B;
  let mx = 0, mn = 0;
  series.forEach(s => s.vals.forEach(v => { mx = Math.max(mx, v); mn = Math.min(mn, v); }));
  if (mx === 0 && mn === 0) mx = 1;
  const span = mx - mn, y = v => T + ih * (mx - v) / span, y0 = y(0);
  const bw = iw / cats.length, gap = Math.min(4, bw * 0.25), sw = Math.max(1.5, (bw - gap) / series.length - (series.length > 1 ? 2 : 0));
  let g = '';
  [mx, mx / 2].forEach(v => { if (v > 0) g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#ececec"/><text x="${L - 4}" y="${y(v) + 3.5}" font-size="9.5" fill="#999" text-anchor="end">${manY(v)}</text>`; });
  if (mn < 0) g += `<text x="${L - 4}" y="${y(mn) + 3.5}" font-size="9.5" fill="#999" text-anchor="end">${manY(mn)}</text>`;
  let bars = '', hits = '';
  cats.forEach((c, i) => {
    series.forEach((s, j) => {
      const v = s.vals[i]; if (!v) return;
      const x = L + i * bw + gap / 2 + j * (sw + 2), top = Math.min(y(v), y0), h = Math.max(1, Math.abs(y(v) - y0)), r = Math.min(3, sw / 2, h);
      // 0の線から伸びる側だけ角を丸める
      bars += v > 0
        ? `<path d="M${x},${y0}V${top + r}Q${x},${top} ${x + r},${top}H${x + sw - r}Q${x + sw},${top} ${x + sw},${top + r}V${y0}Z" fill="${s.color}"/>`
        : `<path d="M${x},${y0}V${y0 + h - r}Q${x},${y0 + h} ${x + r},${y0 + h}H${x + sw - r}Q${x + sw},${y0 + h} ${x + sw},${y0 + h - r}V${y0}Z" fill="${s.color}"/>`;
    });
    if (opt.lab ? opt.lab(i) : true) g += `<text x="${L + i * bw + bw / 2}" y="${H - 5}" font-size="9.5" fill="#999" text-anchor="middle">${esc(c)}</text>`;
    hits += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${g}<line x1="${L}" x2="${W - 4}" y1="${y0}" y2="${y0}" stroke="#ccc"/>${bars}${hits}</svg><div class="ctip"></div>`;
  const tipEl = el.querySelector('.ctip'), svg = el.querySelector('svg');
  const show = ev => {
    const t = ev.target.closest('rect[data-i]'); if (!t) return;
    const i = +t.dataset.i, rb = svg.getBoundingClientRect(), sc = rb.width / W;
    tipEl.innerHTML = tip(i); tipEl.style.display = 'block';
    let x = (L + i * bw + bw / 2) * sc; x = Math.max(70, Math.min(rb.width - 70, x));
    tipEl.style.left = x + 'px'; tipEl.style.top = (T * sc + 2) + 'px';
  };
  svg.addEventListener('pointerover', show); svg.addEventListener('click', show);
  svg.addEventListener('pointerleave', () => { tipEl.style.display = 'none'; });
}

// ---------- PL ----------
const C_S = '#2f6fd1', C_P = '#e8833a';
let PL = null, PLTAB = 'sum';
let PLYM = new Date(Date.now() + 9 * 3600000 - 5 * 3600000).toISOString().slice(0, 7);
try { PLTAB = localStorage.getItem('bhPlTab') || 'sum'; } catch (e) {}
function ymAdd(ym, n) { const [a, b] = ym.split('-').map(Number); const d = new Date(Date.UTC(a, b - 1 + n, 1)); return d.toISOString().slice(0, 7); }
function plMove(d) {
  const nx = ymAdd(PLYM, d), cur = new Date(Date.now() + 4 * 3600000).toISOString().slice(0, 7);
  if (nx > cur) return toast('これより先の月はまだありません');
  PLYM = nx; plLoad();
}
function plSetTab(t) { PLTAB = t; try { localStorage.setItem('bhPlTab', t); } catch (e) {} plRender(); window.scrollTo(0, 0); document.getElementById('appPl').scrollTop = 0; }
async function plLoad() {
  const [a, b] = PLYM.split('-');
  document.getElementById('plYm').textContent = `${a}年${+b}月`;
  if (!PL || PL.ym !== PLYM) document.getElementById('plBody').innerHTML = '<div class="empty">読み込み中…（キャスカンから集計しています）</div>';
  try { PL = await call('plData', PLYM); plRender(); }
  catch (e) { document.getElementById('plBody').innerHTML = `<div class="empty">読み込めませんでした<br>${esc(e.message || e)}</div>`; }
}
function plRender() {
  const tabs = [['sum', '概要'], ['exp', '経費'], ['ref', '紹介料']];
  document.getElementById('plTabs').innerHTML = tabs.map(t => `<button class="${t[0] === PLTAB ? 'on' : ''}" onclick="plSetTab('${t[0]}')">${t[1]}${t[0] === 'ref' && PL && PL.refUnset ? ' <span class="chip" style="background:#fdecea;color:#d93025">未設定' + PL.refUnset + '</span>' : ''}</button>`).join('');
  document.getElementById('plFab').style.display = PLTAB === 'ref' ? 'none' : '';
  if (!PL) return;
  const b = document.getElementById('plBody');
  if (PLTAB === 'sum') b.innerHTML = plSumHtml();
  if (PLTAB === 'exp') b.innerHTML = plExpHtml();
  if (PLTAB === 'ref') b.innerHTML = plRefHtml();
  if (PLTAB === 'sum') plCharts();
}
function plSumHtml() {
  const P = PL, gross = P.s - P.p, pct = v => P.s ? Math.round(v / P.s * 1000) / 10 + '%' : '';
  const cats = Object.keys(P.byCat).sort((a, c) => P.byCat[c] - P.byCat[a]);
  let h = `<div class="kpis" style="margin:12px">
    <div class="kpi big"><div class="l">利益</div><div class="v ${P.profit < 0 ? 'neg' : ''}">${yen(P.profit)}</div><div class="s">利益率 ${pct(P.profit) || '—'}</div></div>
    <div class="kpi"><div class="l">売上</div><div class="v">${yen(P.s)}</div><div class="s">${P.n}本・1本あたり ${P.n ? yen(P.s / P.n) : '—'}</div></div>
    <div class="kpi"><div class="l">女性報酬</div><div class="v">${yen(P.p)}</div><div class="s">売上の ${pct(P.p) || '—'}</div></div>
    <div class="kpi"><div class="l">紹介料</div><div class="v">${yen(P.refTotal)}</div><div class="s">${P.refUnset ? '<span class="neg">決まり未設定 ' + P.refUnset + '人</span>' : P.refs.length + '人の紹介者'}</div></div>
    <div class="kpi"><div class="l">経費</div><div class="v">${yen(P.exp)}</div><div class="s">${P.items.length}件</div></div>
  </div>`;
  if (P.fut.n) h += `<div class="note">このあとの予約 ${P.fut.n}件（${yen(P.fut.s)}）は、始まった時点で入ります。</div>`;
  h += `<div class="card"><h3>損益（PL）</h3><table class="pl">
    <tr><td>売上</td><td class="n">${yen(P.s)}</td><td class="r">100%</td></tr>
    <tr class="sub"><td>女性報酬</td><td class="n">${yen(-P.p)}</td><td class="r">${pct(P.p)}</td></tr>
    <tr class="tot"><td>粗利</td><td class="n">${yen(gross)}</td><td class="r">${pct(gross)}</td></tr>
    <tr class="sub"><td>紹介料${P.refUnset ? ' <span class="neg" style="font-size:11px">未設定あり</span>' : ''}</td><td class="n">${yen(-P.refTotal)}</td><td class="r">${pct(P.refTotal)}</td></tr>
    ${cats.map(c => `<tr class="sub"><td>${esc(c)}</td><td class="n">${yen(-P.byCat[c])}</td><td class="r">${pct(P.byCat[c])}</td></tr>`).join('')}
    ${cats.length ? '' : '<tr class="sub"><td>経費</td><td class="n">¥0</td><td class="r"></td></tr>'}
    <tr class="fin"><td>利益</td><td class="n ${P.profit < 0 ? 'neg' : ''}">${yen(P.profit)}</td><td class="r">${pct(P.profit)}</td></tr>
  </table></div>`;
  h += `<div class="card"><h3>日別の売上</h3><div class="chart" id="chDay"></div></div>`;
  h += `<div class="card"><h3>月ごとの推移</h3><div class="legend"><span><i style="background:${C_S}"></i>売上</span><span><i style="background:${C_P}"></i>利益</span></div><div class="chart" id="chMon"></div></div>`;
  h += `<div class="card"><h3>女性別</h3>${P.casts.length ? P.casts.map(c => `<div class="lrow"><div class="m"><div class="t">${esc(c.c)}</div><div class="d">${c.n}本・${c.days}日・報酬 ${yen(c.p)}${c.ref ? '・' + esc(c.ref) : ''}</div></div><div class="a">${yen(c.s)}</div></div>`).join('') : '<div class="d" style="color:#999">この月の予約はありません</div>'}</div>`;
  h += `<div class="note">売上・女性報酬はキャスカンの予約（キャンセル以外・始まった分）から。朝5時までは前の日に数えます。${esc(P.at)} 時点</div>`;
  return h;
}
function plCharts() {
  const P = PL, [a, m] = P.ym.split('-').map(Number), nd = new Date(a, m, 0).getDate();
  const map = {}; P.days.forEach(d => { map[d.d] = d; });
  const ds = [], vs = [];
  for (let i = 1; i <= nd; i++) { const k = P.ym + '-' + String(i).padStart(2, '0'); ds.push(k); vs.push(map[k] ? map[k].s : 0); }
  barChart(document.getElementById('chDay'), ds.map(d => +d.slice(8)), [{ name: '売上', color: C_S, vals: vs }],
    i => { const d = map[ds[i]]; return `${m}/${i + 1}<br>` + (d ? `売上 ${yen(d.s)}<br>報酬 ${yen(d.p)}<br>${d.n}本` : '予約なし'); },
    { lab: i => i === 0 || (i + 1) % 5 === 0 });
  const T = P.trend;
  barChart(document.getElementById('chMon'), T.map(t => +t.ym.slice(5) + '月'), [{ name: '売上', color: C_S, vals: T.map(t => t.s) }, { name: '利益', color: C_P, vals: T.map(t => t.profit) }],
    i => { const t = T[i]; return `${t.ym.replace('-', '年')}月<br>売上 ${yen(t.s)}（${t.n}本）<br>報酬 ${yen(t.p)}・紹介料 ${yen(t.ref)}<br>経費 ${yen(t.exp)}<br><b>利益 ${yen(t.profit)}</b>`; });
}
function plExpHtml() {
  const P = PL, cats = Object.keys(P.byCat).sort((a, c) => P.byCat[c] - P.byCat[a]);
  let h = `<div class="card"><h3>区分ごと<span>${yen(P.exp)}</span></h3>${cats.length ? cats.map(c => `<div class="lrow"><div class="m"><div class="t">${esc(c)}</div></div><div class="a">${yen(P.byCat[c])}</div></div>`).join('') : '<div class="d" style="color:#999">まだありません。右下の「＋ 経費」から入れてください</div>'}</div>`;
  h += `<div class="card"><h3>明細</h3>${P.items.map((it, i) => `<div class="lrow" onclick="expEdit(${i})"><div class="m"><div class="t">${esc(it.t)}</div><div class="d">${it.d.slice(5).replace('-', '/')}・<span class="chip">${esc(it.cat)}</span>${it.to ? '・' + esc(it.to) : ''}${it.memo ? '・' + esc(it.memo) : ''}</div></div><div class="a">${yen(it.a)}</div></div>`).join('') || '<div class="d" style="color:#999">この月の経費はありません</div>'}</div>`;
  h += `<div class="note">経費はNotionの「経費」表にも入ります（Notionで直しても反映されます）。紹介料は「紹介料」タブで自動計算するので、ここには入れません。</div>`;
  return h;
}
let EXPCAT = 'その他';
function expEdit(i) {
  const it = typeof i === 'number' ? PL.items[i] : null;
  EXPCAT = it ? it.cat : '備品・消耗品';
  const today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
  const d0 = it ? it.d : (PLYM === today.slice(0, 7) ? today : PLYM + '-01');
  openSheet(`<div class="ttl">${it ? '経費を直す' : '経費を入れる'}</div>
    <div class="fld2"><div class="fld"><label>日付</label><input type="date" id="exD" value="${d0}"></div><div class="fld"><label>金額（円）</label><input id="exA" inputmode="numeric" value="${it ? it.a : ''}" placeholder="0"></div></div>
    <div class="fld"><label>区分</label><div class="cats" id="exC">${PL.cats.map(c => `<button class="${c === EXPCAT ? 'on' : ''}" onclick="EXPCAT='${c}';document.querySelectorAll('#exC button').forEach(b=>b.classList.toggle('on',b.textContent===EXPCAT))">${c}</button>`).join('')}</div></div>
    <div class="fld"><label>内容</label><input id="exT" value="${esc(it ? it.t : '')}" placeholder="例：タオル 20枚"></div>
    <div class="fld2"><div class="fld"><label>支払先</label><input id="exTo" value="${esc(it ? it.to : '')}"></div><div class="fld"><label>メモ</label><input id="exM" value="${esc(it ? it.memo : '')}"></div></div>
    <div class="sbtns">${it ? `<button class="pbtn red" onclick="expDel('${it.id}')">消す</button>` : `<button class="pbtn g" onclick="closeSheet()">やめる</button>`}<button class="pbtn" onclick="expSave(${it ? `'${it.id}'` : 'null'})">保存</button></div>`);
  if (!it) setTimeout(() => document.getElementById('exA').focus(), 150);
}
async function expSave(id) {
  const e = { d: val('exD'), a: Number(String(val('exA')).replace(/[^\d]/g, '')), cat: EXPCAT, t: val('exT').trim(), to: val('exTo').trim(), memo: val('exM').trim() };
  if (!e.a) return toast('金額を入れてください');
  if (!e.t) e.t = e.cat;
  try { await call(id ? 'plExpEdit' : 'plExpAdd', ...(id ? [id, e] : [e])); closeSheet(); toast('保存しました'); PL = null; plLoad(); }
  catch (x) { toast('保存できませんでした: ' + (x.message || x), 5000); }
}
async function expDel(id) {
  if (!confirm('この経費を消しますか？（Notionのゴミ箱に入ります）')) return;
  try { await call('plExpDel', id); closeSheet(); toast('消しました'); PL = null; plLoad(); } catch (x) { toast('消せませんでした: ' + (x.message || x), 5000); }
}
function plRefHtml() {
  const P = PL, types = P.refTypes;
  let h = `<div class="note">紹介者ごとに紹介料の決まりを入れると、この月の売上・本数・出勤日数から自動で計算します。紹介者は台帳（問い合わせ台帳）の「紹介者」欄から取っています。</div>`;
  h += `<div class="card"><h3>この月の紹介料<span>${yen(P.refTotal)}</span></h3>`;
  if (!P.refs.length) h += '<div class="d" style="color:#999">この月に紹介者のついた女性の売上はありません</div>';
  P.refs.forEach((r, i) => {
    const rl = r.rule || {};
    h += `<div style="padding:12px 0;border-bottom:1px solid #eee">
      <div style="display:flex;justify-content:space-between;align-items:center"><div class="t" style="font-weight:800;font-size:16px">${esc(r.ref)}</div><div class="a" style="font-weight:800;font-size:18px">${r.fee === null ? '<span class="neg" style="font-size:13px">決まり未設定</span>' : yen(r.fee)}</div></div>
      <div class="d" style="font-size:12px;color:#999;margin-top:2px">売上 ${yen(r.s)}・${r.n}本・のべ${r.days}日</div>
      <div class="rule"><select id="rt${i}"><option value="">決まりなし</option>${Object.keys(types).map(t => `<option value="${t}" ${rl.type === t ? 'selected' : ''}>${types[t]}</option>`).join('')}</select><input id="rv${i}" inputmode="decimal" value="${rl.type ? rl.v : ''}" placeholder="数字"><button class="pbtn sm" onclick="refRule(${i})">保存</button></div>
      ${r.casts.map(c => `<div class="lrow" style="padding:6px 0"><div class="m"><div class="t" style="font-size:14px">${esc(c.c)}</div><div class="d">${yen(c.s)}・${c.n}本・${c.days}日</div></div><div class="a" style="font-size:14px">${c.fee === null || c.fee === undefined ? '—' : yen(c.fee)}</div></div>`).join('')}
      <button class="pbtn sm ${r.paid ? 'g' : ''}" style="margin-top:6px" onclick="refPaid(${i}, ${r.paid ? 'false' : 'true'})">${r.paid ? '✓ 支払済み（' + esc(r.paid) + '）' : '支払済みにする'}</button>
    </div>`;
  });
  h += '</div>';
  const none = P.casts.filter(c => !c.ref);
  if (none.length) h += `<div class="card"><h3>紹介者が台帳に無い女性</h3>${none.map(c => `<div class="lrow"><div class="m"><div class="t">${esc(c.c)}</div><div class="d">${c.n}本</div></div><div class="a">${yen(c.s)}</div></div>`).join('')}<div class="d" style="font-size:12px;color:#999;margin-top:6px">紹介料が要る人なら、台帳の「紹介者」を入れると自動で上に入ります。</div></div>`;
  return h;
}
async function refRule(i) {
  const r = PL.refs[i], t = val('rt' + i), v = Number(val('rv' + i));
  if (t && !(v > 0)) return toast('数字を入れてください');
  try { await call('plRefRule', r.ref, t, v); toast('保存しました'); PL = null; plLoad(); } catch (x) { toast('保存できませんでした: ' + (x.message || x), 5000); }
}
async function refPaid(i, on) {
  try { await call('plRefPaid', PL.ym, PL.refs[i].ref, on); PL = null; plLoad(); } catch (x) { toast('できませんでした: ' + (x.message || x), 5000); }
}

// ---------- 在庫 ----------
let ST = null;
async function stLoad() {
  if (!ST) document.getElementById('stBody').innerHTML = '<div class="empty">読み込み中…</div>';
  try { ST = await call('stockList'); stRender(); }
  catch (e) { document.getElementById('stBody').innerHTML = `<div class="empty">読み込めませんでした<br>${esc(e.message || e)}</div>`; }
}
function stRender() {
  const it = ST.items, low = it.filter(x => x.min > 0 && x.q <= x.min);
  let h = '';
  if (low.length) h += `<div class="card" style="background:#fdecea"><h3 style="color:#d93025">少なくなっている物 ${low.length}件</h3><div style="font-size:14px;line-height:1.7">${low.map(x => esc(x.name) + ' 残り' + x.q + esc(x.unit)).join('<br>')}</div></div>`;
  h += `<div class="card">${it.length ? it.map((x, i) => `<div class="stk ${x.min > 0 && x.q <= x.min ? 'low' : ''}">
      <div class="m" onclick="stEdit(${i})"><div class="t">${esc(x.name)}</div><div class="d">${[x.place, x.min ? '発注ライン ' + x.min : '', x.price ? '単価 ' + yen(x.price) : ''].filter(Boolean).map(esc).join('・') || 'タップで編集'}</div></div>
      <button class="qb" onclick="stMove(${i},-1)">−</button><div class="q">${x.q}<small>${esc(x.unit)}</small></div><button class="qb" onclick="stMove(${i},1)">＋</button>
      <button class="pbtn sm g" onclick="stBuy(${i})">仕入</button></div>`).join('')
    : '<div class="empty" style="padding:30px 10px">まだ品目がありません。<br>右下の「＋ 品目を追加」から入れてください。<br><span style="font-size:12px">例：タオル・オイル・紙ショーツ・ティッシュ</span></div>'}</div>`;
  if (ST.log.length) h += `<div class="card"><h3>最近の動き</h3>${ST.log.slice(0, 15).map(l => `<div class="lrow" style="padding:6px 0"><div class="m"><div class="d" style="margin:0;color:#555;font-size:13px">${esc(l.at)}　${esc(l.name)} ${l.d > 0 ? '+' : ''}${l.d} → ${l.q}${l.cost ? '（経費 ' + yen(l.cost) + '）' : ''}</div></div></div>`).join('')}</div>`;
  h += '<div class="note">在庫はNotionの「在庫」表にも入ります。「仕入」で金額を入れると、経費（備品・消耗品）にも自動で入ります。</div>';
  document.getElementById('stBody').innerHTML = h;
}
async function stMove(i, d, cost) {
  const x = ST.items[i];
  if (d < 0 && x.q <= 0) return;
  x.q = Math.max(0, x.q + d); stRender();
  try { const r = await call('stockMove', x.id, d, cost || 0); x.q = r.q; if (cost) { toast('経費にも入れました'); PL = null; } stLoad(); }
  catch (e) { toast('保存できませんでした: ' + (e.message || e), 5000); stLoad(); }
}
function stBuy(i) {
  const x = ST.items[i];
  openSheet(`<div class="ttl">${esc(x.name)} を仕入れ</div>
    <div class="fld2"><div class="fld"><label>数</label><input id="byN" inputmode="numeric" value="1" oninput="if(${x.price || 0})document.getElementById('byA').value=(Number(this.value)||0)*${x.price || 0}"></div><div class="fld"><label>金額（円・経費に入る）</label><input id="byA" inputmode="numeric" value="${x.price || ''}" placeholder="空なら経費に入れない"></div></div>
    <div class="sbtns"><button class="pbtn g" onclick="closeSheet()">やめる</button><button class="pbtn" onclick="stBuyDo(${i})">入れる</button></div>`);
}
function stBuyDo(i) {
  const n = Number(val('byN')) || 0, a = Number(String(val('byA')).replace(/[^\d]/g, '')) || 0;
  if (n <= 0) return toast('数を入れてください');
  closeSheet(); stMove(i, n, a);
}
function stEdit(i) {
  const x = typeof i === 'number' ? ST.items[i] : { name: '', q: 0, unit: '個', min: 0, place: '', price: 0, memo: '' };
  openSheet(`<div class="ttl">${x.id ? '品目を直す' : '品目を追加'}</div>
    <div class="fld"><label>品名</label><input id="skN" value="${esc(x.name)}" placeholder="例：バスタオル"></div>
    <div class="fld2"><div class="fld"><label>今の数</label><input id="skQ" inputmode="numeric" value="${x.q}"></div><div class="fld"><label>単位</label><input id="skU" value="${esc(x.unit)}" placeholder="枚・本・個"></div></div>
    <div class="fld2"><div class="fld"><label>発注ライン（この数以下で赤）</label><input id="skMin" inputmode="numeric" value="${x.min || ''}"></div><div class="fld"><label>単価（円）</label><input id="skP" inputmode="numeric" value="${x.price || ''}"></div></div>
    <div class="fld2"><div class="fld"><label>場所</label><input id="skPl" value="${esc(x.place)}" placeholder="ルームA・ルームBなど"></div><div class="fld"><label>メモ</label><input id="skM" value="${esc(x.memo)}"></div></div>
    <div class="sbtns">${x.id ? `<button class="pbtn red" onclick="stDel('${x.id}')">消す</button>` : `<button class="pbtn g" onclick="closeSheet()">やめる</button>`}<button class="pbtn" onclick="stSave(${x.id ? `'${x.id}'` : 'null'})">保存</button></div>`);
  if (!x.id) setTimeout(() => document.getElementById('skN').focus(), 150);
}
async function stSave(id) {
  const e = { name: val('skN').trim(), q: Number(val('skQ')) || 0, unit: val('skU').trim(), min: Number(val('skMin')) || 0, price: Number(String(val('skP')).replace(/[^\d]/g, '')) || 0, place: val('skPl').trim(), memo: val('skM').trim() };
  if (!e.name) return toast('品名を入れてください');
  try { await call('stockSave', id, e); closeSheet(); toast('保存しました'); stLoad(); } catch (x) { toast('保存できませんでした: ' + (x.message || x), 5000); }
}
async function stDel(id) {
  if (!confirm('この品目を消しますか？（Notionのゴミ箱に入ります）')) return;
  try { await call('stockDel', id); closeSheet(); toast('消しました'); stLoad(); } catch (x) { toast('消せませんでした: ' + (x.message || x), 5000); }
}
renderSw();
if (APP !== 'inbox') setTimeout(() => setApp(APP), 0);
</script>
